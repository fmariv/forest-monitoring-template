project: forest-monitoring-template
storage:
  - name: data
    type: s3
scripts:
  - name: forest-monitoring
    run_on_start: true
    image: europe-west1-docker.pkg.dev/spai-430907/spai-build/forest-monitoring-template-script:latest
apis:
  - name: api
    port: 8021
    host: localhost
    image: europe-west1-docker.pkg.dev/spai-430907/spai-build/forest-monitoring-template-api:latest
    autoscaling:
      min: 1
      max: 1
      keep_alive: 60
uis:
  - name: map
    # command: npm run dev # for local development
    command: npm run deploy
    port: 5173
    runtime: node
    image: europe-west1-docker.pkg.dev/spai-430907/spai-build/forest-monitoring-template-ui:latest
    autoscaling:
      min: 1
      max: 1
      keep_alive: 60
    env:
      API_URL: api.api
